name: Merge prod promotion on approval

# Code-owner approval is the only human step after the checks are running.
# This merges the PR, then calls PROD Promote. The merge itself is done with
# the workflow token, and that kind of push does not start PROD Promote on
# its own, so the deploy is called directly.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  checks: read
  id-token: write

jobs:
  merge:
    if: github.event.review.state == 'approved' && startsWith(github.event.pull_request.head.ref, 'promote-prod/')
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    outputs:
      should_deploy: ${{ steps.result.outputs.should_deploy }}
      ref: ${{ steps.result.outputs.ref }}
    steps:
      - name: Wait for the required checks, then squash-merge
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # GH_REPO lets gh run without a checkout. This job has no .git directory.
          echo "ref=$HEAD" >> "$GITHUB_OUTPUT"
          ok=""
          for i in $(seq 1 40); do
            ok=$(gh pr view "$PR" --repo "$GH_REPO" --json state,statusCheckRollup --jq '
              [.statusCheckRollup[]?
                | select(.name == "checks" or .name == "prod-checks")
                | .conclusion] as $c
              | if .state != "OPEN" then "closed"
                elif ($c | length) < 2 then "wait"
                elif ($c | all(. == "SUCCESS")) then "ready"
                elif ($c | any(. == "FAILURE" or . == "CANCELLED" or . == "TIMED_OUT" or . == "ACTION_REQUIRED")) then
                  if ($c | any(. == "ACTION_REQUIRED")) then "approve-workflows" else "fail" end
                else "wait" end')
            echo "attempt $i: $ok"
            if [ "$ok" = "approve-workflows" ]; then
              echo "Checks are waiting. On the PR, click Approve workflows to run."
            fi
            [ "$ok" = "ready" ] || [ "$ok" = "closed" ] || [ "$ok" = "fail" ] && break
            sleep 15
          done
          if [ "$ok" = "closed" ]; then
            echo "PR is already merged."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ok" != "ready" ]; then
            echo "::error::Prod promotion checks did not pass. If they never started, use Approve workflows to run on the PR, then approve again."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          gh pr merge "$PR" --repo "$GH_REPO" --squash --delete-branch
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: merge
    if: needs.merge.outputs.should_deploy == 'true'
    uses: ./.github/workflows/prod-promote.yml
    with:
      ref: ${{ needs.merge.outputs.ref }}
