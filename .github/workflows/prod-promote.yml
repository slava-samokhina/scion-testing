name: PROD Promote

# Fires after a prod promotion PR auto-merges to main (release/prod/** changed).
# The agent opens that PR with auto-merge. CODEOWNERS approval plus the
# uat-checks and prod-checks statuses are both required before GitHub merges.
# This job does not pause: `environment: prod` is only a deployment record.
#
# Copies the UAT image digest-for-digest into apps-prod, re-attests the new
# prod image URL (Binary Authorization matches the full URL), deploys, and
# shifts traffic. /health is checked by the Cloud Run startup probe inside the
# new revision. GitHub never calls the service URL, so a private or
# sign-in-protected app still promotes. No rebuild. gcloud + gcrane only.

on:
  push:
    branches: [main]
    paths:
      - "release/prod/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: prod-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Copy, re-attest, deploy to PROD
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP (WIF, keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PROD_PROMOTER_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta

      - name: Install gcrane
        run: |
          set -euo pipefail
          VER="${{ vars.GCRANE_VERSION }}"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${VER}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - gcrane
          sudo mv gcrane /usr/local/bin/gcrane
          gcrane version || true

      - name: Promote each release manifest
        run: |
          set -euo pipefail

          REGION="${{ vars.GCP_REGION }}"
          UAT_PROJECT="${{ vars.UAT_PROJECT_ID }}"
          PROD_PROJECT="${{ vars.PROD_PROJECT_ID }}"
          UAT_REPO="${{ vars.UAT_AR_REPO }}"
          PROD_REPO="${{ vars.PROD_AR_REPO }}"

          for f in release/prod/*.json; do
            echo "::group::Promoting $f"
            APP="$(jq -r .app "$f")"
            DIGEST="$(jq -r .uat_digest "$f")"
            RELEASE="$(jq -r .release "$f")"
            VERSION="${RELEASE##*/}"

            SRC="${REGION}-docker.pkg.dev/${UAT_PROJECT}/${UAT_REPO}/${APP}@${DIGEST}"
            DST_REPO="${REGION}-docker.pkg.dev/${PROD_PROJECT}/${PROD_REPO}/${APP}"

            echo "== 1. Copy uat -> prod (digest-preserving) =="
            gcrane cp "$SRC" "${DST_REPO}:${VERSION}"

            echo "== 2. Assert the digest did not change =="
            PROD_DIGEST="$(gcrane digest "${DST_REPO}:${VERSION}")"
            echo "uat digest:  $DIGEST"
            echo "prod digest: $PROD_DIGEST"
            if [ "$PROD_DIGEST" != "$DIGEST" ]; then
              echo "::error::Digest changed during copy ($DIGEST -> $PROD_DIGEST)."
              exit 1
            fi
            PROD_IMAGE="${DST_REPO}@${PROD_DIGEST}"

            echo "== 3. Scan for CRITICAL vulns (gcloud / Artifact Analysis) =="
            CRIT="$(gcloud artifacts docker images describe "$PROD_IMAGE" \
              --project="$PROD_PROJECT" --show-package-vulnerability \
              --format='value(package_vulnerability_summary.vulnerabilities.CRITICAL)' 2>/dev/null || echo "")"
            if [ -n "$CRIT" ]; then
              echo "::error::Critical vulnerabilities present: $CRIT"
              exit 1
            fi
            echo "OK — no CRITICAL vulnerabilities."

            echo "== 4. Re-attest the PROD image URL for Binary Authorization =="
            gcloud beta container binauthz attestations sign-and-create \
              --project="$PROD_PROJECT" \
              --artifact-url="$PROD_IMAGE" \
              --attestor="${{ vars.ATTESTOR }}" --attestor-project="$PROD_PROJECT" \
              --keyversion-project="$PROD_PROJECT" --keyversion-location=global \
              --keyversion-keyring="${{ vars.KMS_KEYRING }}" \
              --keyversion-key="${{ vars.KMS_KEY }}" \
              --keyversion="${{ vars.KMS_KEYVERSION }}" --quiet \
              || echo "(attestation already exists — continuing)"

            SERVICE="${APP}-prod"
            if gcloud run services describe "$SERVICE" \
                 --project="$PROD_PROJECT" --region="$REGION" >/dev/null 2>&1; then
              FIRST_DEPLOY=0
            else
              FIRST_DEPLOY=1
            fi

            # /health is probed inside the revision. A private service, IAP, or
            # internal ingress never has to be reachable from the GitHub runner.
            # Deploy fails, and traffic stays put, if /health does not return 200.
            PROBE="httpGet.path=/health,httpGet.port=8080,timeoutSeconds=5,periodSeconds=10,failureThreshold=6"
            if [ "$FIRST_DEPLOY" = "1" ]; then
              echo "== 5. First deploy: create $SERVICE (serves traffic immediately) =="
              gcloud run deploy "$SERVICE" \
                --project="$PROD_PROJECT" --region="$REGION" \
                --image="$PROD_IMAGE" \
                --service-account="${{ vars.PROD_RUNTIME_SA }}" \
                --binary-authorization=default \
                --no-allow-unauthenticated \
                --startup-probe="$PROBE" \
                --quiet
            else
              echo "== 5. Deploy new revision with NO traffic, tagged 'candidate' =="
              gcloud run deploy "$SERVICE" \
                --project="$PROD_PROJECT" --region="$REGION" \
                --image="$PROD_IMAGE" \
                --service-account="${{ vars.PROD_RUNTIME_SA }}" \
                --binary-authorization=default \
                --no-traffic --tag=candidate \
                --no-allow-unauthenticated \
                --startup-probe="$PROBE" \
                --quiet
            fi

            echo "== 6. Startup probe passed: /health returned 200 inside the new revision =="

            if [ "$FIRST_DEPLOY" = "0" ]; then
              echo "== 7. Shift 100% of traffic to the new revision =="
              gcloud run services update-traffic "$SERVICE" \
                --project="$PROD_PROJECT" --region="$REGION" \
                --to-latest --quiet
            fi

            LIVE_URL="$(gcloud run services describe "$SERVICE" \
              --project="$PROD_PROJECT" --region="$REGION" \
              --format='value(status.url)')"
            echo "✅ $APP promoted to PROD: $LIVE_URL (digest $PROD_DIGEST)"
            echo "::endgroup::"
          done
