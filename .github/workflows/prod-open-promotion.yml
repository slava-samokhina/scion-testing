name: Promote app to prod

# The "promote app to prod" button (Actions → this workflow → Run workflow).
#
# Reads the digest already recorded in release/uat/<app>.json (the artifact that
# was promoted to UAT), writes release/prod/<app>.json, tags the release, and
# opens a PR. It does not deploy. Merging that PR — after CODEOWNERS approval
# and the prod checks — is what runs PROD Promote.
#
# Auto-merge is intentionally not enabled here. A merge performed by this
# workflow's GITHUB_TOKEN would not trigger the deploy workflow. A person
# merges the PR from the GitHub UI, and that push unleashes prod.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to promote (Artifact Registry image name)
        required: true
        default: scion-testing
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    name: Open prod promotion PR
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write release/prod manifest, tag, and open the PR
        env:
          APP: ${{ inputs.app }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC="release/uat/${APP}.json"
          if [ ! -f "$SRC" ]; then
            echo "::error::No UAT manifest at ${SRC}. Promote ${APP} to UAT before prod."
            exit 1
          fi
          DIGEST="$(jq -r .dev_digest "$SRC")"
          UAT_RELEASE="$(jq -r .release "$SRC")"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::UAT manifest has no sha256 dev_digest."; exit 1 ;;
          esac

          VERSION="$(date -u +%Y%m%d-%H%M%S)"
          BRANCH="promote-prod/${APP}/${VERSION}"
          TAG="prod/${APP}/${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          mkdir -p release/prod
          jq -n \
            --arg app "$APP" \
            --arg digest "$DIGEST" \
            --arg release "$TAG" \
            --arg src "$UAT_RELEASE" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{app:$app, uat_digest:$digest, uat_release:$src, release:$release, promoted_at:$at}' \
            > "release/prod/${APP}.json"
          git add "release/prod/${APP}.json"
          git commit -m "promote ${APP} to prod: ${DIGEST} (${TAG})"
          git tag "$TAG"
          git push origin "$BRANCH"
          git push origin "$TAG"
          BODY=$(printf '%s\n' \
            "Prod promotion for **${APP}**." \
            "" \
            "- UAT release: \`${UAT_RELEASE}\`" \
            "- Digest (unchanged, no rebuild): \`${DIGEST}\`" \
            "- Tag: \`${TAG}\`" \
            "" \
            "Approving this PR as code owner merges it and deploys that exact digest to prod." \
            "" \
            "If the checks have not started, use **Approve workflows to run** first. GitHub requires that when Actions itself opened the pull request. Then approve the PR. You do not need to merge it yourself.")
          gh pr create --base main --head "$BRANCH" \
            --title "Promote ${APP} to prod — ${VERSION}" \
            --body "$BODY"
